  /* ========== Dock：下滑收合 / 上滑展开（有曲目才合并） ========== */
  var dockCollapsed = false;
  var dockLastY = 0;
  var dockAcc = 0;
  function hasActiveTrack() {
    var mini = $("#mini");
    return !!(mini && mini.classList.contains("show") && S.queue && S.queue.length);
  }
  function setDockCollapsed(on) {
    var dock = $("#dock");
    if (!dock) return;
    // 未在播放：永远展开，只显示完整底栏
    if (on && !hasActiveTrack()) on = false;
    dockCollapsed = !!on;
    dock.classList.toggle("collapsed", dockCollapsed);
    var homeBtn = $("#dockHome");
    var searchBtn = $("#dockSearch");
    var cur = document.querySelector(".tab.on");
    var page = cur ? cur.dataset.p : "home";
    if (homeBtn) homeBtn.classList.toggle("on", page === "home");
    if (searchBtn) searchBtn.classList.toggle("on", page === "search");
  }
  var _dockToggleAt = 0;
  function bindPageScroll(pageEl) {
    if (!pageEl || pageEl._dockBound) return;
    pageEl._dockBound = true;
    pageEl.addEventListener("scroll", function () {
      if (!hasActiveTrack()) {
        if (dockCollapsed) setDockCollapsed(false);
        dockAcc = 0;
        return;
      }
      var y = pageEl.scrollTop || 0;
      var dy = y - dockLastY;
      dockLastY = y;
      // 顶部附近始终展开
      if (y < 48) {
        dockAcc = 0;
        if (dockCollapsed) setDockCollapsed(false);
        return;
      }
      // 忽略极小抖动
      if (Math.abs(dy) < 2) return;
      // 衰减累积，避免一次惯性滚动连跳
      dockAcc = dockAcc * 0.85 + dy;
      var now = Date.now();
      if (now - _dockToggleAt < 520) return;
      // 阈值更高：需要持续滑一段才切换（更接近苹果绵密手感）
      if (dockAcc > 140) {
        dockAcc = 0;
        _dockToggleAt = now;
        if (!dockCollapsed) setDockCollapsed(true);
      } else if (dockAcc < -100) {
        dockAcc = 0;
        _dockToggleAt = now;
        if (dockCollapsed) setDockCollapsed(false);
      }
    }, { passive: true });
  }
  $$(".page").forEach(bindPageScroll);

      var recList = [], hotList = [], pls = [];
      try {
        var pack = await Promise.all([
          fetchPool(REC_KW, 24, {}, 5).catch(function () { return []; }),
          fetchPool(HOT_KW, 18, {}).catch(function () { return []; }),
          loadPlaylists().catch(function () { return []; }),
        ]);
        recList = pack[0] || [];
        hotList = pack[1] || [];
        pls = pack[2] || [];
      } catch (ePack) { console.warn(ePack); }

      if (!recList.length) recList = shuffle(fb).slice(0, 24);
      if (!hotList.length) hotList = shuffle(fb).slice(0, 18);

      S.feed = hotList;
      S.playlists = pls;
      S.recList = recList;

      var row = $("#recRow");
      if (row) {
        row.innerHTML = "";
        recList.forEach(function (s) { row.appendChild(albumCard(s, recList)); });
      }
      var hot = $("#hotList");
      if (hot) {
        hot.innerHTML = "";
        hotList.forEach(function (s) { hot.appendChild(songRow(s, hotList)); });
      }

      // 猜你喜欢（汽水风日推）+ 听歌雷达（新歌/热搜独立池）
      Promise.all([
        fetchGuessLike(20).catch(function () { return []; }),
        fetchRadarSongs(20).catch(function () { return []; }),
      ]).then(function (pair) {
        var guess = pair[0] || [];
        var radar = pair[1] || [];
        if (!guess.length) guess = fb.slice(0, 8);
        if (!radar.length) radar = shuffle(fb.slice()).slice(0, 8);
        // 尽量不重叠
        var gKeys = {};
        guess.forEach(function (s) { gKeys[keyOf(s)] = 1; });
        radar = radar.filter(function (s) { return !gKeys[keyOf(s)]; }).concat(radar);
        S.guessList = guess;
        S.radarList = radar;
        renderTopDuo(guess, radar);
      }).catch(function () {
        S.guessList = fb.slice(0, 8);
        S.radarList = shuffle(fb.slice()).slice(0, 8);
        try { renderTopDuo(S.guessList, S.radarList); } catch (e3) {}
      });
    } catch (err) {
      console.error("loadHome fatal", err);
      try {
        var fb2 = fallbackSongs();
        renderThemeChannels();
        renderTopDuo(fb2.slice(0, 6), shuffle(fb2.slice()).slice(0, 6));
      } catch (e4) {}
    }
  }

  /* ========== Init ========== */
  try { syncSeg(); } catch (e) {}
  try { updateLibCounts(); } catch (e) {}
  try { renderLibRecent(); } catch (e) {}
  try { bindChTabs(); } catch (e) {}
  try { syncPlatBtn(); } catch (e) {}
  try { setDockCollapsed(false); } catch (e) {}
  try { loadHome(); } catch (e) { console.error(e); }

  window.AQ = { S, play, searchQQ, searchPlaylists, resolvePlay, go, coverUrl };
})();
</script>
