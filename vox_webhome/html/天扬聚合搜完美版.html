<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>天扬搜影</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --netease-red:#ec4141;
    --netease-red-dark:#d73535;
    --netease-red-light:#ff6b6b;
    --netease-bg:#ffffff;
    --netease-bg-soft:#fafafa;
    --netease-text:#333333;
    --netease-text-sub:#999999;
    --netease-border:#f0f0f0;
    --netease-line:#e9e9e9;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--netease-bg); color: var(--netease-text); padding: 20px 20px 40px;
  }
  .app {
    max-width: 900px;
    margin: 0 auto;
    padding-top: calc(28vh + env(safe-area-inset-top, 0px));
  }
  .header { text-align: center; padding: 0 0 16px; }
  .header h1 { font-size: 36px; font-weight: 800; letter-spacing: 2px; color: var(--netease-text); }
  .header h1 span { color: var(--netease-red); }
  .header .sub { font-size: 15px; color: var(--netease-text-sub); margin-top: 4px; letter-spacing: 1px; }

  .search-wrapper { position: relative; margin: 12px 0 20px; }
  .search-box { display: flex; gap: 10px; }
  .search-box input {
    flex: 1; padding: 12px 18px; border: 1.5px solid var(--netease-border); border-radius: 30px;
    font-size: 16px; background: #fff; outline: none;
    transition: border 0.2s, box-shadow 0.2s;
    color: var(--netease-text);
  }
  .search-box input::placeholder { color: var(--netease-text-sub); }
  .search-box input:focus {
    border-color: var(--netease-red); box-shadow: 0 0 0 3px rgba(236,65,65,0.12);
  }
  .search-box button {
    padding: 12px 28px; border: none; border-radius: 30px;
    background: var(--netease-red); color: #fff; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: background 0.2s, transform 0.1s;
    white-space: nowrap; box-shadow: 0 4px 10px rgba(236,65,65,0.25);
  }
  .search-box button:hover { background: var(--netease-red-dark); }
  .search-box button:active { transform: scale(0.97); }
  .search-box button:disabled { opacity: 0.6; cursor: not-allowed; }

  .history-dropdown {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: #fff; border: 1px solid var(--netease-border); border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08); max-height: 220px; overflow-y: auto;
    display: none; z-index: 100; padding: 6px 0;
  }
  .history-dropdown.active { display: block; }
  .history-dropdown .history-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; cursor: pointer; font-size: 15px; color: var(--netease-text);
  }
  .history-dropdown .history-item:hover { background: var(--netease-bg-soft); }
  .history-dropdown .history-item .del-btn {
    background: none; border: none; color: #cbd5e1; font-size: 16px; padding: 0 4px; cursor: pointer;
  }
  .history-dropdown .history-item .del-btn:hover { color: var(--netease-red); }
  .history-dropdown .empty-history { padding: 20px 16px; text-align: center; color: var(--netease-text-sub); font-size: 14px; }
  .history-dropdown .clear-history-btn {
    display: block; width: 100%; text-align: center; padding: 10px;
    border: none; border-top: 1px solid var(--netease-line); background: transparent;
    color: var(--netease-text-sub); font-size: 13px; cursor: pointer;
  }
  .history-dropdown .clear-history-btn:hover { background: var(--netease-bg-soft); color: var(--netease-red); }

  .site-filter {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px;
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--netease-line);
    box-shadow: 0 -4px 16px rgba(0,0,0,0.04);
  }
  .site-filter::-webkit-scrollbar { display: none; }
  .site-chip {
    flex: 0 0 auto; padding: 6px 16px; border-radius: 30px;
    border: 1.5px solid var(--netease-border); background: #fff; color: var(--netease-text);
    font-size: 14px; cursor: pointer; white-space: nowrap;
    transition: all 0.15s;
  }
  .site-chip:hover { border-color: var(--netease-red); color: var(--netease-red); }
  .site-chip.active { background: var(--netease-red); border-color: var(--netease-red); color: #fff; }
  .site-chip .count { font-size: 12px; opacity: 0.75; margin-left: 4px; }

  .result-container { margin-top: 8px; padding-bottom: 100px; }
  .video-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  }
  @media (min-width: 600px) { .video-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 900px) { .video-grid { grid-template-columns: repeat(5, 1fr); } }

  .video-card {
    background: #fff; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--netease-border); cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex; flex-direction: column;
  }
  .video-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(236,65,65,0.15); border-color: #ffd6d6; }
  .video-card .poster {
    width: 100%; aspect-ratio: 2/3; background: #f0f0f0;
    position: relative; overflow: hidden;
  }
  .video-card .poster img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .video-card .poster .noimg {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--netease-text-sub); font-size: 12px; background: linear-gradient(135deg, #f5f5f5, #ebebeb);
  }
  .video-card .poster .site-badge {
    position: absolute; top: 6px; left: 6px;
    background: rgba(236,65,65,0.92); color: #fff;
    padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600;
    backdrop-filter: blur(4px);
  }
  .video-card .meta { padding: 8px 8px 10px; flex: 1; }
  .video-card .name {
    font-size: 13px; font-weight: 600; color: var(--netease-text);
    line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .video-card .src {
    font-size: 11px; color: var(--netease-text-sub); margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .loading, .empty-result, .error-result {
    text-align: center; padding: 40px 0; color: var(--netease-text-sub); font-size: 14px;
  }
  .error-result { color: var(--netease-red); }

  .search-progress {
    text-align: center; padding: 10px 0 6px; color: var(--netease-text-sub); font-size: 13px;
    display: flex; justify-content: center; align-items: center; gap: 10px;
  }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid #f0f0f0; border-top-color: var(--netease-red);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: var(--netease-text); color: #fff; padding: 10px 24px; border-radius: 30px;
    font-size: 14px; box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    display: none; z-index: 999;
  }
  .toast.show { display: block; }

  .sheet{
    position:fixed;inset:0;z-index:200;
    display:none;background:var(--netease-bg);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
  }
  .sheet.active{display:block;transform:translateX(0)}

  .det-topbar{
    position:sticky;top:0;z-index:10;
    height:calc(56px + env(safe-area-inset-top, 0px));
    padding-top:env(safe-area-inset-top, 0px);
    padding-left:16px;
    padding-right:16px;
    display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--netease-line);
  }
  .det-topbar-title{
    flex:1;min-width:0;
    font-size:16px;font-weight:700;color:var(--netease-text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .det-close-btn{
    width:36px;height:36px;border-radius:50%;
    background:#f5f5f5;color:var(--netease-text);
    border:none;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .det-close-btn:hover{background:#ebebeb;color:var(--netease-red)}
  .panel{
    padding: calc(18vh + env(safe-area-inset-top, 0px)) 20px 40px;
    max-width:900px;margin:0 auto;
  }
  .det-bigtitle{
    font-size:24px;font-weight:800;color:var(--netease-text);
    margin:8px 0 16px;line-height:1.25;
    word-break:break-word;
  }
  .det-sec-label{
    font-size:13px;font-weight:700;color:var(--netease-text-sub);
    margin:16px 0 10px;letter-spacing:.5px;
    display:flex;align-items:center;gap:10px;
  }
  .det-sec-label::after{
    content:'';flex:1;height:1px;background:var(--netease-line);
  }
  .pan-list{display:flex;flex-direction:column;gap:10px}
  .pan-item{
    display:flex;align-items:center;gap:12px;
    padding:14px 18px;border-radius:12px;
    background:#fff;border:1px solid var(--netease-border);
    cursor:pointer;transition:all .15s;
    box-shadow:0 1px 3px rgba(0,0,0,.03);
  }
  .pan-item:hover{border-color:var(--netease-red);box-shadow:0 4px 12px rgba(236,65,65,.12)}
  .pan-type{
    flex:0 0 auto;padding:4px 10px;border-radius:8px;
    background:#ffe5e5;color:var(--netease-red);
    font-size:12px;font-weight:700;
  }
  .pan-info{flex:1;min-width:0}
  .pan-name{
    font-size:15px;font-weight:600;color:var(--netease-text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .pan-url{
    font-size:12px;color:var(--netease-text-sub);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .pan-open-btn{
    flex:0 0 auto;
    padding:8px 16px;border-radius:8px;
    background:var(--netease-red);color:#fff;
    font-size:14px;font-weight:600;
    border:none;cursor:pointer;
    transition:background 0.15s;
  }
  .pan-open-btn:hover{background:var(--netease-red-dark)}
  .pan-open-btn:active{transform:scale(.95)}
  .det-loading{
    padding:60px 0;text-align:center;color:var(--netease-text-sub);font-size:14px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .det-spinner{
    width:32px;height:32px;border-radius:50%;
    border:3px solid #f0f0f0;border-top-color:var(--netease-red);
    animation:spin .7s linear infinite;
  }

  @media (max-width: 480px) {
    .header h1 { font-size: 28px; }
    .search-box { flex-wrap: wrap; }
    .search-box input { flex: 1 1 100%; }
    .search-box button { flex: 1; }
    .app { padding-top: calc(28vh + env(safe-area-inset-top, 0px)); }
    .video-grid { gap: 8px; }
    .panel { padding: calc(18vh + env(safe-area-inset-top, 0px)) 14px 40px; }
    .det-bigtitle { font-size: 20px; }
    .site-filter { padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); }
    .result-container { padding-bottom: 90px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>天扬<span>搜影</span></h1>
    <div class="sub">纯粹观影，实用才是王道！</div>
  </div>

  <div class="search-wrapper">
    <div class="search-box">
      <input id="searchInput" type="search" placeholder="输入电影或剧集名称...">
      <button id="searchBtn">搜索</button>
    </div>
    <div id="historyDropdown" class="history-dropdown"></div>
  </div>

  <div id="resultContainer" class="result-container"></div>
</div>

<div id="siteFilter" class="site-filter" style="display:none;"></div>

<div class="sheet" id="sheet">
  <div class="det-topbar">
    <div class="det-topbar-title" id="detTopbarTitle"></div>
    <button class="det-close-btn" id="detCloseBtn">✕</button>
  </div>
  <div class="panel" id="panel"></div>
</div>

<div id="toast" class="toast"></div>

<script>
'use strict';
// ============================================================
//  天扬搜影 · 影视聚合版（网易云红白配色）· 合并增强版（16 源）
//  ★ 站源筛选栏固定在屏幕底部
//  ★ 玩偶站源永远排第一位
//  ★ 新增源：至臻 / 米字 / 花卷 / 云集(flarum) / 人人 /
//            讴歌
// ============================================================

const state = { allItems: [], filterSite: 'all' };
let _searchGen = 0;
let _currentDetailItem = null;
let _currentPlaybackTitle = '';
let _searching = false;
let _lastSearchKeyword = '';

function toast(text){
  const el=document.getElementById('toast');
  el.textContent=text; el.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>el.classList.remove('show'),2000);
}
function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function clean(s){return String(s||'').replace(/\s+/g,' ').trim();}

// 等待原生桥接注入：App 可能在页面脚本之后才注入 window.fm，最多等 4 秒
let _fmReadyP=null;
function fmReady(){
  if(_fmReadyP)return _fmReadyP;
  _fmReadyP=new Promise(res=>{
    if(window.fm&&window.fm.req)return res(window.fm);
    let t=0;
    const iv=setInterval(()=>{
      t+=60;
      if((window.fm&&window.fm.req)||t>4000){clearInterval(iv);res(window.fm||null);}
    },60);
  });
  return _fmReadyP;
}

const CORS_PROXIES=[
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u)
];

// 统一请求层：原生桥接直连优先，浏览器 fetch 兜底，CORS 代理最后
async function req(url,timeoutSec=16,quiet=false,opts){
  const _method=(opts&&opts.method==='POST')?'POST':'GET';
  const _body=(opts&&opts.body!=null)?opts.body:'';
  const fm=await fmReady();
  if(fm&&fm.req){
    const _init={method:_method,headers:{'User-Agent':'Mozilla/5.0','Referer':url},responseType:'text',timeout:timeoutSec};
    if(_method==='POST'){_init.headers['Content-Type']='application/x-www-form-urlencoded';_init.body=_body}
    let r=await fm.req(url,_init);
    if(!r.ok)throw new Error(r.error||('HTTP '+r.status));
    return r.body||''
  }
  try{
    const ac=new AbortController();const t=setTimeout(()=>ac.abort(),timeoutSec*1000);
    let r;
    try{
      r=await fetch(url,_method==='POST'
        ?{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:_body,signal:ac.signal}
        :{headers:{'User-Agent':'Mozilla/5.0'},signal:ac.signal});
    }finally{clearTimeout(t)}
    return await r.text()
  }catch(e){
    let lastErr=e.message;
    for(const mk of CORS_PROXIES){
      try{let r=await fetch(mk(url));if(r.ok){let t=await r.text();if(t)return t}lastErr='HTTP '+r.status}
      catch(err){lastErr=err.message}
    }
    throw new Error(lastErr||'请求失败');
  }
}// ===== 可用域名缓存 =====
// 多域名站每次请求只打「上次成功域名」（单连接），缓存失效时才并发挥现并更新缓存。
const DOMAIN_CACHE=(()=>{try{return JSON.parse(localStorage.getItem('wo_domain_cache')||'{}')}catch(e){return {}}})();
function _saveDomainCache(){try{localStorage.setItem('wo_domain_cache',JSON.stringify(DOMAIN_CACHE))}catch(e){}}

// ===== 同站请求闸门：串行 + 最小间隔，抑制单域名站的 429 限流 =====
const SITE_MIN_GAP=600;          // 同站两次请求最小间隔(ms)
const _siteLock={};              // siteId -> Promise
const _siteMeta={};              // siteId -> {last, backoffUntil}
function _siteM(id){ return _siteMeta[id]||(_siteMeta[id]={last:0,backoffUntil:0}); }
function _gateSleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function get(site,path,timeoutSec=16,quiet=false,opts){
  const sid=site&&site.id; const m=sid?_siteM(sid):null;
  let attempt=0;
  for(;;){
    const prev=_siteLock[sid]||Promise.resolve();
    let release; const next=new Promise(r=>release=r); if(sid)_siteLock[sid]=next;
    let result,err;
    try{
      await prev;
      if(m){
        const wb=Math.max(0,m.backoffUntil-Date.now()); if(wb>0) await _gateSleep(wb);
        const since=Date.now()-m.last; if(since<SITE_MIN_GAP) await _gateSleep(SITE_MIN_GAP-since);
        m.last=Date.now();
      }
      result=await _getInner(site,path,timeoutSec,quiet,opts);
    }catch(e){ err=e; }
    finally{ if(sid) release(); }
    if(err){
      if(m && /429/.test(err.message) && attempt<3){
        attempt++;
        const delay=Math.min(8000,1200*Math.pow(2,attempt-1));
        m.backoffUntil=Date.now()+delay;
        await _gateSleep(delay);
        continue;
      }
      throw err;
    }
    return result;
  }
}

async function _getInner(site,path,timeoutSec=16,quiet=false,opts){
  try{
    if(!quiet){
      const needsLong=(site.domains||[]).some(d=>/\d+\.\d+\.\d+\.\d+|:\d{2,5}/.test(d));
      if(needsLong && timeoutSec<28) timeoutSec=28;
    }
  }catch(e){}
  // 绝对 URL：直接请求一次
  if(path.startsWith('http')){
    let h=await req(path,timeoutSec,quiet,opts);
    if(!h||/just a moment|cf-browser|access denied/i.test(h))throw new Error('响应被拦截或为空');
    let base=path;try{const u=new URL(path);base=u.protocol+'//'+u.host}catch(e){}
    return{html:h,base}
  }
  const domains=site.domains;
  const tryOne=async(d,to)=>{
    const base=d.replace(/\/+$/,''),u=base+path;
    let h=await req(u,to,quiet,opts);
    if(!h||/just a moment|cf-browser|access denied/i.test(h))throw new Error('域名被拦截或无响应');
    if(/domain is expired|your domain is expired|此域名|域名.*过期|停放|出售该域名|parked domain|coming soon|已经关站|站点已关闭|网站已关闭|关站维护/i.test(h)
       && !/module-item|module-search-item|vod\/detail|mac_url|mac_type|a\.card|res-it|宅男网盘|class="item"|data-date|广播剧|fangkong/i.test(h)){
      throw new Error('域名已过期、关站或停放');
    }
    return{html:h,base,_domain:d}
  };
  if(domains.length===1){
    return await tryOne(domains[0],timeoutSec);
  }
  const cached=DOMAIN_CACHE[site.id];
  if(cached&&domains.includes(cached)){
    try{
      return await tryOne(cached,Math.min(timeoutSec,10));
    }catch(e){
      try{ delete DOMAIN_CACHE[site.id]; _saveDomainCache(); }catch(_e){}
    }
  }
  return new Promise((resolve,reject)=>{
    let pending=domains.length,lastErr='',settled=false;
    domains.forEach(d=>{
      const base=d.replace(/\/+$/,''),u=base+path;
      req(u,timeoutSec,quiet,opts).then(h=>{
        if(settled)return;
        if(h&&!/just a moment|cf-browser|access denied/i.test(h)){
          settled=true;
          if(DOMAIN_CACHE[site.id]!==d){DOMAIN_CACHE[site.id]=d;_saveDomainCache()}
          resolve({html:h,base});
        }
        else{lastErr='响应被拦截';if(--pending===0&&!settled)reject(new Error(lastErr||'全部域名失败'))}
      }).catch(e=>{
        if(settled)return;
        lastErr=e.message;
        if(--pending===0&&!settled)reject(new Error(lastErr||'全部域名失败'));
      });
    });
  });
}function doc(h){return new DOMParser().parseFromString(h,'text/html')}
function imgUrl(u){
  if(!u)return'';
  u=u.replace(/^\/\//,'https://');
  let m=u.match(/^https?:\/\/image\.baidu\.com\/search\/down\?url=([^&]+)/i);
  return m?decodeURIComponent(m[1]):u
}
function abs(base,u){try{return new URL(u,base+'/').href}catch(e){return u||''}}

// 自动识别清晰度
function getQuality(text){
  if(/4K|2160/i.test(text))return'4K';
  if(/1080|1080P/i.test(text))return'1080P';
  if(/720|720P/i.test(text))return'720P';
  return'';
}

/* 从文件名/标题提取画质标签 */
function extractQualityFromName(name){
  const t=String(name||'');
  const tags=[];
  const push=s=>{ if(s&&tags.indexOf(s)<0) tags.push(s); };
  if(/\b8K\b|4320\s*[Pp]?/i.test(t)) push('8K');
  else if(/\b4K\b|2160\s*[Pp]?|UHD/i.test(t)) push('4K');
  else if(/1440\s*[Pp]?/i.test(t)) push('1440P');
  else if(/1080\s*[Pp]?|FHD/i.test(t)) push('1080P');
  else if(/720\s*[Pp]?/i.test(t)) push('720P');
  else if(/480\s*[Pp]?/i.test(t)) push('480P');
  if(/DoVi|Dolby\s*Vision|杜比视界/i.test(t)) push('杜比视界');
  else if(/HDR10\+?/i.test(t)) push('HDR10');
  else if(/\bHDR\b|高动态/i.test(t)) push('HDR');
  if(/REMUX/i.test(t)) push('REMUX');
  else if(/Blu-?Ray|蓝光原盘|原盘/i.test(t)) push('蓝光');
  else if(/WEB-?DL|WEBRip/i.test(t)) push('WEB-DL');
  if(/H\.?265|HEVC|x265/i.test(t)) push('H265');
  else if(/H\.?264|x264|AVC/i.test(t)) push('H264');
  if(/60\s*[Ff]ps|60帧/i.test(t)) push('60fps');
  if(/臻彩|真彩/i.test(t)) push('臻彩');
  return tags.slice(0,4).join(' · ');
}

// 去除站源标题噪声：前缀（立即播放等）+ 后缀（下载/在线观看等）
function stripTitleNoise(t){
  const orig=String(t||'').trim();
  let r=orig
    .replace(/^[【\[]?(?:立即|立刻|马上|火速|超清|高清|蓝光)?(?:播放|观看|看片|点播|追剧)(?:[：:、\s]+)?/,'')
    .replace(/^(?:在线观看|在线播放|免费观看|免费播放)(?:[：:、\s]+)?/,'')
    .replace(/(?:\s|·|—|–|-|_|\||\/)*(?:高清|超清|蓝光|4K|1080[Pp]?|720[Pp]?)?(?:完整版|完整)?(?:在线)?(?:免费)?(?:下载|观看|播放|点播)(?:专区|地址|链接)?\s*$/i,'')
    .replace(/[【\[\(（]?下载[】\]\)）]?\s*$/,'')
    .replace(/\s*下载\s*$/,'')
    .trim();
  if(!r||r.length<=1)return orig;
  return r;
}

/* 网盘广告尾巴清洗：《片名》百度云网盘夸克下载.阿里云盘.中字 → 《片名》 */
function stripPanNoise(t){
  const orig=String(t||'').trim();
  let s=orig
    .replace(/(?:百度|阿里|夸克|迅雷|UC|115|123)?云?(?:网盘|云盘)(?:夸克|百度|阿里|迅雷)?/ig,'')
    .replace(/(?:网盘|云)?下载/g,'')
    .replace(/[.。·]{1,}/g,' ')
    .replace(/(?:中字|无字)/g,'')
    .replace(/[（(【\[]\s*[）)】\]]/g,'')
    .replace(/\s{2,}/g,' ')
    .replace(/[\s·\-—_、,，]+$/,'');
  s=s.replace(/[（(【\[]\s*$/,'').trim();
  return s&&s.length>=2?s:orig;
}

function flarumExtract(text){
  const t=String(text||'').trim();
  if(t.charAt(0)==='{'){ try{ return JSON.parse(t); }catch(e){} }
  // 论坛页是前端渲染的 SPA，但会把接口结果整段塞进 #flarum-json-payload（搜索页 ?q= 也能拿到）
  const m=t.match(/<script id="flarum-json-payload"[^>]*>([\s\S]*?)<\/script>/i);
  if(m){
    try{ const o=JSON.parse(m[1]); if(o&&o.apiDocument) return o.apiDocument; }catch(e){}
  }
  return null;
}
function flarumCards(text, s, base){
  let data=null;
  try{ data=flarumExtract(text); }catch(e){ return []; }
  if(!data||!Array.isArray(data.data)) return [];
  const posts={};
  (data.included||[]).forEach(i=>{ if(i&&i.type==='posts'&&i.id!=null) posts[i.id]=i; });
  const out=[];
  data.data.forEach(x=>{
    const a=(x&&x.attributes)||{};
    const id=x&&x.id;
    // 云集标题形如「片名 (2013)丨纪录片丨英国电影丨豆瓣8.3分」：只保留第一个 丨/| 前面的正片名
    const _raw=String(a.title||'').replace(/\s+/g,' ').trim();
    const _seg=_raw.split(/[丨｜|]/)[0].trim();
    const title=stripTitleNoise(_seg.length>=2?_seg:_raw);
    if(!title||!id) return;
    const href=abs(base,'/d/'+id);
    // 封面：正文第一张图（帖子自带的 cover）；取不到就留空
    let pic='';
    const rel=(((x.relationships||{}).firstPost||{}).data)||{};
    const html=rel.id&&posts[rel.id]?String(((posts[rel.id].attributes)||{}).contentHtml||''):'';
    if(html){
      const m=html.match(/<img[^>]+src=["']([^"']+)["']/i);
      if(m) pic=imgUrl(m[1])||'';
    }
    const yr=(String(a.title||'').match(/(?:19|20)\d{2}/)||[])[0]||'';
    out.push({
      title:title.slice(0,60),
      href,
      pic,
      remark:yr||s.name,
      siteId:s.id,
      siteName:s.name,
      quality:getQuality(title+' '+(yr||''))
    });
  });
  return out;
}/* ===== 搜索地址自适应 + 单站搜索（增强版：含 flarum/POST/宅男合成）===== */

  }
  if(!anyOk&&lastErr)throw lastErr; // 所有格式都网络层失败 → 抛错，让聚合搜索的重试机制接手

}/* ===== 网盘类型识别（增强版）===== */

/* ===== 宅男 go.php 中转解析 ===== */
async function resolveGoPhpUrl(u, goK, baseOrigin){
  try{
    let k=goK||'';
    if(!k){
      const m=String(u||'').match(/[?&]k=([^&]+)/i);
      if(m) k=decodeURIComponent(m[1]);
    }
    if(!k) return u;
    let origin=baseOrigin||'';
    if(!origin){
      try{ origin=new URL(u).origin; }catch(e){}
    }
    if(!origin) origin='https://v.time1080.xyz';
    origin=origin.replace(/\/+$/,'');
    const jurl=origin+'/go.php?json=1&k='+encodeURIComponent(k);
    try{
      const body=await req(jurl,5,true);
      let j=body;
      if(typeof body==='string'){
        const t=body.trim();
        try{ j=JSON.parse(t); }
        catch(e1){
          const m=t.match(/\{[\s\S]*?"url"\s*:\s*"[^"]+"[\s\S]*?\}/);
          if(m){ try{ j=JSON.parse(m[0]); }catch(e2){ j=null; } }
          else j=null;
        }
      }
      if(j&&j.url) return j.url;
      if(j&&j.magnet) return (String(j.magnet).startsWith('magnet:')?j.magnet:'magnet:'+j.magnet);
    }catch(eJson){}
    // JSON 失败：再请求 go.php 普通跳转页，从 HTML 里捞 Location / 真实网盘域名
    try{
      const page=await req(origin+'/go.php?k='+encodeURIComponent(k),5,true);
      const t=String(page||'');
      let m=t.match(/https?:\/\/(?:[\w.-]*\.)?(?:pan\.quark\.cn|pan\.baidu\.com|www\.aliyundrive\.com|www\.alipan\.com|aliyundrive\.com|alipan\.com|pan\.xunlei\.com|115\.com|115cdn\.[a-z0-9]+|cloud\.189\.cn|drive\.uc\.cn|mypikpak\.com)\/[A-Za-z0-9\-_/?=&%.#~+]*/i);
      if(m) return m[0].replace(/&amp;/g,'&').replace(/[，。、）)]+$/,'');
      m=t.match(/content=["']\s*0\s*;\s*url=([^"']+)/i);
      if(m) return m[1].trim();
    }catch(ePage){}
  }catch(e){}
  return u;
}

    if(k==='uc'||k==='UC') k='uc';
    if(k==='迅雷') k='xunlei';
    if(k==='磁力') k='magnet';
    return k;
  };
  const by=new Map();
  (list||[]).forEach(p=>{
    if(!p) return;
    const plat=norm(p);
    if(!by.has(plat)) by.set(plat,[]);
    const arr=by.get(plat);
    if(arr.length<perPlat) arr.push(p);

  for(const plat of order){
    for(const p of (by.get(plat)||[])){
      if(out.length>=maxTotal) break;
      out.push(p); used.add(p);
    }
    if(out.length>=maxTotal) break;
  }
  if(out.length<maxTotal){
    for(const p of (list||[])){
      if(!p||used.has(p)) continue;
      out.push(p); used.add(p);
      if(out.length>=maxTotal) break;
    }
  }
  return out;
}

async function resolveGoPhpBatch(list, baseOrigin, limit){
  limit=limit||8;
  const need=list.filter(p=>p&&(p._goK||/\/go\.php\?/i.test(p.url||'')));
  if(!need.length) return list;
  const slice=need.slice(0, limit);
  const CONC=8;
  let i=0;
  async function worker(){
    while(i<slice.length){
      const idx=i++;
      const p=slice[idx];
      try{
        const real=await resolveGoPhpUrl(p.url, p._goK, baseOrigin);
        if(real&&real!==p.url&&!/\/go\.php\?/i.test(real)){
          p.url=real;
          const t=panType(real);
          if(t&&t!=='网盘') p.type=t;
          try{ p.name=zhainanDisplayName(p, p._filmTitle||''); }catch(eN){}
        }
      }catch(e){}
    }
  }
  await Promise.all(Array.from({length:Math.min(CONC,slice.length)},()=>worker()));
  return list;

        };
        if(hdr) payload.headers=hdr;

        return;
      }catch(e){ console&&console.warn&&console.warn('[play vodInline]',e); }
    }

    // 2) fm.play（原版带 format:'hls' + 海报）
    if(u && fm && fm.play){
      try{
        const opts={pic:pic,wallPic:pic,format:'hls'};
        if(hdr) opts.headers=hdr;
        await fm.play(u, playTitle, opts);
        return;
      }catch(e){
        try{ await fm.play(u, playTitle, {pic:pic,wallPic:pic}); return; }catch(e2){}
        try{ await fm.play(u, playTitle); return; }catch(e3){}
      }
    }

    // 3) 浏览器 HLS
    try{
      openBrowserHlsPlayer(playTitle, epList, hdr||{});
      return;
    }catch(eBr){}

    try{ if(fm&&fm.open){ await fm.open(u); return; } }catch(e){}
    try{
      if(typeof toast==='function') toast('播放失败：请切换 Exo 播放器重试');
    }catch(e){}
    return;
  }
  // ===== 网盘分支：封面/海报 + 元数据推给原生播放页 =====
  const _item=_currentDetailItem||{};
  const _title=(filmTitle||p.title||p.name||'').trim();
  let _pic='';
  try{ _pic=await ensurePlayPoster(_item, p, _title); }catch(e){ try{ _pic=resolvePlayPoster(_item,p); }catch(e2){} }
  // 站源元数据（极简：无 TMDB）
  let _merged=mergePlayMeta(_item._detailInfo||{}, null, _item);
  if(!_merged.actor||!_merged.desc||!_merged.director){
    try{
      const tm=await tmdbDetailMeta(_title||_item.title||'', _merged.year||_item.year||'');
      if(tm){ _merged=mergePlayMeta(_item._detailInfo||{}, tm, _item); }
    }catch(eT){}
  }
  const _vodMeta={
    vod_name:_title,
    vod_pic:_pic,
    wallPic:_pic,
    pic:_pic,
    cover:_pic,
    type_name:String(_merged.typeName||_merged.cls||p.type||''),
    vod_class:String(_merged.cls||_merged.typeName||''),
    vod_tag:String(_merged.tag||''),
    vod_actor:String(_merged.actor||''),
    vod_director:String(_merged.director||''),
    vod_year:String(_merged.year||''),
    vod_area:String(_merged.area||''),
    vod_lang:String(_merged.lang||''),
    vod_remarks:String(_merged.remarks||''),
    vod_score:String(_merged.score||''),
    vod_content:String(_merged.desc||''),
    vod_source:String(_merged.siteName||_item.siteName||p.siteName||'')
  };
  if(fm&&fm.pan&&fm.pan.play&&!String(u).startsWith('magnet:')){
    try{
      let type=panColorKey(p.type||p._plat||u);
      if(type==='other') type=panColorKey(u);
      if(type==='other') type='quark';
      // 海报多字段别名：不同壳子读 pic / vod_pic / poster / image / cover 不一
      const _imgFields=_pic?{pic:_pic,wallPic:_pic,vod_pic:_pic,poster:_pic,image:_pic,cover:_pic,vodPic:_pic}:{};
      // 优先带全量元数据；壳不支持多余字段时再降级
      try{
        await fm.pan.play(Object.assign({type,url:u,password:pwd,title:_title,name:_title}, _vodMeta, _imgFields));
        return;
      }catch(eFull){}
      await fm.pan.play(Object.assign({type,url:u,password:pwd,title:_title,name:_title}, _imgFields));
      return;
    }catch(e){}
  }
  if(fm&&fm.play){
    try{
      const playUrl=u.startsWith('magnet:')?u:'push://'+u;
      try{ await fm.play(playUrl, _title, Object.assign({pic:_pic,wallPic:_pic}, _vodMeta)); return; }catch(e1){}
      try{ await fm.play(playUrl, _title, {pic:_pic,wallPic:_pic}); return; }catch(e2){}
      await fm.play(playUrl, _title);
      return;
    }catch(e){}
  }
  location.href=u;
}

/* ===== 聚合搜索（第一段逻辑 + 适配新源）===== */
async function searchAllSites(keyword,onProgress,gen){
  const map=new Map();
  let done=0,shown=false;
  const total=SITES.length;
  const CONC=5;
  const jobs=SITES.map(s=>({site:s,q:keyword}));
  let idx=0;
  function isStale(){return gen!==_searchGen;}
  function merge(list){
    list.forEach(x=>{
      const key=(x.siteId||'')+'|'+x.href;
      if(!map.has(key))map.set(key,x);
    });
  }
  function flush(){
    if(isStale())return;
    const arr=[...map.values()];
    if(onProgress)onProgress(arr,done,total);
  }
  async function worker(){
    while(idx<jobs.length){
      if(isStale())return;
      const job=jobs[idx++];
      if(!job)continue;
      try{
        const list=await searchSite(job.site,job.q,16);
        if(isStale())return;
        merge(list);
      }catch(e){}
      if(isStale())return;
      done++;
      if(!shown&&map.size>0){shown=true;flush();}
      else if(shown&&done%2===0)flush();
    }
  }
  await Promise.all(Array.from({length:Math.min(CONC,jobs.length)},()=>worker()));
  if(isStale())return [];
  flush();
  return [...map.values()];
}

function getHistory(){try{return JSON.parse(localStorage.getItem('tianyang_search_history'))||[]}catch(e){return[]}}

function addHistory(kw){
  kw=kw.trim();if(!kw)return;
  let list=getHistory().filter(i=>i!==kw);
  list.unshift(kw);
  if(list.length>12)list=list.slice(0,12);
  saveHistory(list);renderHistoryDropdown();
}
function removeHistory(kw){saveHistory(getHistory().filter(i=>i!==kw));renderHistoryDropdown();}
function clearAllHistory(){saveHistory([]);renderHistoryDropdown();toast('已清除全部历史');}
function renderHistoryDropdown(){
  const list=getHistory();

  if(!c)return;

function renderSiteFilter(items){
  const box=document.getElementById('siteFilter');
  if(!box)return;
  if(!items||!items.length){box.style.display='none';return;}
  const groups={};
  items.forEach(it=>{
    const k=it.siteId;
    if(!groups[k])groups[k]={name:it.siteName,count:0};
    groups[k].count++;
  });
  const sites=Object.keys(groups);
  sites.sort((a,b)=>{
    if(a==='wanou')return -1;
    if(b==='wanou')return 1;
    return 0;
  });
  if(sites.length<=1){box.style.display='none';return;}
  let html=`<button class="site-chip ${state.filterSite==='all'?'active':''}" data-site="all">全部 <span class="count">(${items.length})</span></button>`;
  sites.forEach(k=>{
    const g=groups[k];
    html+=`<button class="site-chip ${state.filterSite===k?'active':''}" data-site="${escapeHtml(k)}">${escapeHtml(g.name)} <span class="count">(${g.count})</span></button>`;
  });
  box.innerHTML=html;
  box.style.display='flex';

/* ===== 详情面板（增强版：在线源展示 + pending 后台解析追加）===== */
function openDetail(v){
  if(!v||!v.href)return toast('链接无效');
  _currentDetailItem=v;
  _currentPlaybackTitle=v.title||'';

  if(location.hash !== '#detail'){
    history.pushState({wo:'detail'}, '', '#detail');
  }

  const sheet=document.getElementById('sheet');
  const panel=document.getElementById('panel');
  const topbarTitle=document.getElementById('detTopbarTitle');
  if(!sheet||!panel||!topbarTitle)return;

  topbarTitle.textContent=v.title||'';
  sheet.classList.add('active');
  sheet.scrollTop=0;
  document.body.style.overflow='hidden';

  panel.innerHTML='<div class="det-loading"><div class="det-spinner"></div><span>读取详情…</span></div>';

  parseDetail(v).then(d=>{
    const info=d.info||{};
    const title=info.title||v.title||'';
    _currentPlaybackTitle=title;
    topbarTitle.textContent=title;
    v._detailInfo=info;

    // 在线源（最高画质/官网/在线）排最前，其余网盘按类型排
    const panRank={'最高画质':-4,'官网':-3,'在线':-2,'夸克':0,'百度':1,'UC':2,'阿里':3,'123':4,'115':5,'迅雷':6,'天翼':7,'移动':8,'光鸭':9};
    d.pans.sort((a,b)=>{
      const ra=panRank[a.type]!==undefined?panRank[a.type]:99;
      const rb=panRank[b.type]!==undefined?panRank[b.type]:99;
      return ra-rb;
    });

    function renderPanel(){
      if(_currentDetailItem!==v)return;
      const isOnline=p=>p._online||p.type==='在线'||p.type==='最高画质'||p.type==='官网'||/\.m3u8(\?|$)/i.test(String(p.url||''));
      panel.innerHTML=`
        <div class="det-bigtitle">${escapeHtml(title)}</div>
        <div class="det-sec-label">${d.pans.some(isOnline)?'播放/网盘资源':'网盘资源'}（${d.pans.length}）</div>
        <div class="pan-list">
          ${d.pans.map((p,i)=>`
            <div class="pan-item" data-i="${i}">
              <span class="pan-type">${escapeHtml(isOnline(p)?(p.type==='最高画质'||p.type==='在线'?'播放':(p.type||'播放')):p.type)}</span>
              <div class="pan-info">
                <div class="pan-name">${escapeHtml(isOnline(p)?(p.name&&p.name!=='打开'?p.name:p.title||'在线播放'):((p.type||'')+'网盘 '+(p.name&&p.name!=='打开'?p.name:'')))}</div>
                <div class="pan-url">${escapeHtml(p.url)}</div>
              </div>
              <button class="pan-open-btn" data-i="${i}">播放</button>
            </div>`).join('')||'<div class="empty-result">未提取到资源</div>'}
        </div>`;
      panel.querySelectorAll('.pan-item').forEach(item=>{
        item.onclick=(e)=>{
          if(e.target.closest('.pan-open-btn'))return;
          const i=parseInt(item.dataset.i);
          playPan(d.pans[i]);
        };
      });
      panel.querySelectorAll('.pan-open-btn').forEach(btn=>{
        btn.onclick=(e)=>{
          e.stopPropagation();
          const i=parseInt(btn.dataset.i);
          playPan(d.pans[i]);
        };
      });
    }
    renderPanel();

    // pending：后台解析 go.php 中转链，成功后追加渲染
    if(d.pending&&d.pending.length){
      setTimeout(async()=>{
        try{
          let origin='https://v.time1080.xyz';
          try{ if(d.pending[0]&&d.pending[0].url) origin=new URL(d.pending[0].url).origin; }catch(e){}
          const list=d.pending.slice();
          await Promise.race([
            resolveGoPhpBatch(list,origin,Math.min(list.length,8)),
            new Promise(r=>setTimeout(r,9000))
          ]);
          if(_currentDetailItem!==v)return;
          const ready=list.filter(p=>p&&isRealPanUrl(p.url));
          if(!ready.length)return;
          ready.forEach(p=>{ try{p.name=zhainanDisplayName(p,d.filmTitle||title)}catch(e){} });
          const seen2=new Set(d.pans.map(x=>x.url));
          const extra=ready.filter(p=>!seen2.has(p.url)&&!(seen2.has(String(p.url||'').split('?')[0])));
          if(!extra.length)return;
          extra.forEach(p=>d.pans.unshift(p));
          d.pending=[];
          renderPanel();
        }catch(e){}
      },300);
    }
  }).catch(e=>{
    panel.innerHTML=`<div class="det-loading"><div>详情失败：${escapeHtml(e.message||'')}</div></div>`;
  });
}

/* ===== 搜索入口（第一段逻辑）===== */
async function doSearch(keyword){
  if(_searching){
    toast('正在搜索中，请稍候…');
    return;
  }
  const drop=document.getElementById('historyDropdown');
  if(drop)drop.classList.remove('active');
  keyword=keyword.trim();
  if(!keyword)return toast('请输入片名');

  addHistory(keyword);

  const gen=++_searchGen;
  _searching=true;
  _lastSearchKeyword=keyword;

  const btn=document.getElementById('searchBtn');
  if(btn){btn.disabled=true;btn.textContent='搜索中…';}

  const c=document.getElementById('resultContainer');
  const filterBox=document.getElementById('siteFilter');
  if(filterBox)filterBox.style.display='none';
  if(c)c.innerHTML='<div class="search-progress"><div class="spinner"></div>正在搜索影视源…</div>';

  state.allItems=[];
  state.filterSite='all';

  try{
    const items=await searchAllSites(keyword,(arr,done,total)=>{
      if(gen!==_searchGen)return;
      state.allItems=arr;
      if(arr.length){
        renderSiteFilter(arr);
        renderVideoGrid();
        const tip=document.querySelector('.search-progress');
        if(tip)tip.innerHTML=`<div class="spinner"></div>已找到 ${arr.length} 条，正在搜索剩余站源…（${done}/${total}）`;
      }
    },gen);

    if(gen!==_searchGen)return;

    state.allItems=items;
    if(!items.length){
      if(c)c.innerHTML='<div class="empty-result">未找到相关影视资源</div>';
    }else{
      renderSiteFilter(items);
      renderVideoGrid();
    }
  }catch(e){
    if(gen!==_searchGen)return;
    if(c)c.innerHTML=`<div class="error-result">搜索失败：${escapeHtml(e.message||'未知错误')}</div>`;
  }finally{
    _searching=false;
    if(btn){btn.disabled=false;btn.textContent='搜索';}
  }
}

/* ===== 启动（第一段逻辑）===== */
document.addEventListener('DOMContentLoaded',()=>{
  const input=document.getElementById('searchInput');
  const btn=document.getElementById('searchBtn');
  const dropdown=document.getElementById('historyDropdown');
  if(!input||!btn||!dropdown)return;
  let blurTimer=null;

  renderHistoryDropdown();

  input.addEventListener('focus',()=>{clearTimeout(blurTimer);dropdown.classList.add('active');renderHistoryDropdown();});
  input.addEventListener('blur',()=>{clearTimeout(blurTimer);blurTimer=setTimeout(()=>dropdown.classList.remove('active'),180);});
  btn.addEventListener('click',()=>doSearch(input.value));
  input.addEventListener('keydown',(e)=>{if(e.key==='Enter'){e.preventDefault();doSearch(input.value);}});

  const detCloseBtn=document.getElementById('detCloseBtn');
  if(detCloseBtn)detCloseBtn.onclick=closeDetail;
  const sheet=document.getElementById('sheet');
  if(sheet)sheet.addEventListener('click',(e)=>{
    if(e.target.id==='sheet')closeDetail();
  });

  window.addEventListener('popstate', function(e){
    const sh=document.getElementById('sheet');
    if(sh && sh.classList.contains('active')){
      _doCloseDetail();
      return;
    }
    if(location.hash === '#detail'){
      history.replaceState({}, '', location.pathname + location.search);
    }
  });

  const params=new URLSearchParams(location.search);
  const q=params.get('q');
  if(q){input.value=q;doSearch(q);}
});
</script>
</body>
</html>
