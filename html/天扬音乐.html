    <script>
        // ================== 工具函数 ==================
        function decodeHTML(html) {
            if (!html) return '';
            const txt = document.createElement("textarea");
            txt.innerHTML = html;
            return txt.value;
        }
        
        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return '00:00';
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }
        
        function artworkShort2Long(albumpicShort) {
            if (!albumpicShort) return undefined;
            const idx = albumpicShort.indexOf("/");
            return idx !== -1 ? `https://img4.kuwo.cn/star/albumcover/1080${albumpicShort.slice(idx)}` : undefined;
        }
        
        function getDefaultCover() {
            const canvas = document.createElement('canvas');
            canvas.width = 100;
            canvas.height = 100;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 100, 100);
            grad.addColorStop(0, '#E03A3A');
            grad.addColorStop(1, '#A82222');
            ctx.fillStyle = grad;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(0, 0, 100, 100, 12);
            else ctx.rect(0, 0, 100, 100);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = '48px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('♪', 50, 56);
            return canvas.toDataURL('image/png');
        }
        const DEFAULT_COVER = getDefaultCover();
        const PROXY_BASE = 'https://jsnzkpg4.pages.dev/';
        
        function getProxyUrl(url) {
            const cleanProxy = PROXY_BASE.endsWith('/') ? PROXY_BASE : PROXY_BASE + '/';
            return `${cleanProxy}${url}`;
        }
        
        // ================== ★★★ 收藏管理（重构：存储完整歌曲信息）★★★ ==================
        const FAV_STORAGE_KEY = 'tymusic_favorites_v2';
        
        // 核心收藏数据：favorites = { songId: { id, title, artist, album, artwork, favTime } }
        let favorites = {};
        // 收藏顺序（用于保持收藏列表的顺序）
        let favoriteOrder = [];
        
        function loadFavorites() {
            try {
                const data = localStorage.getItem(FAV_STORAGE_KEY);
                if (data) {
                    const parsed = JSON.parse(data);
                    // 新格式：{ songs: { id: songInfo }, order: [id, ...] }
                    if (parsed && typeof parsed === 'object' && parsed.songs && Array.isArray(parsed.order)) {
                        favorites = parsed.songs;
                        favoriteOrder = parsed.order.filter(id => favorites[id]);
                        // 清理孤儿
                        const validIds = new Set(favoriteOrder);
                        Object.keys(favorites).forEach(id => {
                            if (!validIds.has(id)) delete favorites[id];
                        });
                        favoriteOrder = favoriteOrder.filter(id => favorites[id]);
                        return;
                    }
                    // 兼容旧格式1：数组 [id1, id2, ...]
                    if (Array.isArray(parsed)) {
                        favorites = {};
                        favoriteOrder = [];
                        parsed.forEach(id => {
                            if (typeof id === 'string') {
                                // 旧数据只有id，用占位信息填充
                                favorites[id] = {
                                    id: id,
                                    title: '未知歌曲',
                                    artist: '未知歌手',
                                    album: '',
                                    artwork: DEFAULT_COVER,
                                    favTime: Date.now()
                                };
                                favoriteOrder.push(id);
                            }
                        });
                        saveFavorites();
                        return;
                    }
                    // 兼容旧格式2：{ "id": { ... } } 但没有 order
                    if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
                        const keys = Object.keys(parsed);
                        if (keys.length > 0 && parsed[keys[0]] && typeof parsed[keys[0]] === 'object' && parsed[keys[0]]
                            .id) {
                            favorites = parsed;
                            favoriteOrder = keys;
                            // 确保每个对象都有 favTime
                            let needSave = false;
                            keys.forEach(id => {
                                if (!favorites[id].favTime) {
                                    favorites[id].favTime = Date.now();
                                    needSave = true;
                                }
                            });
                            if (needSave) saveFavorites();
                            return;
                        }
                    }
                }
                // 无数据
                favorites = {};
                favoriteOrder = [];
            } catch (e) {
                favorites = {};
                favoriteOrder = [];
                console.warn('加载收藏数据失败', e);
            }
        }
        
        function saveFavorites() {
            try {
                const payload = {
                    songs: favorites,
                    order: favoriteOrder
                };
                localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(payload));
            } catch (e) {
                console.warn('保存收藏数据失败', e);
            }
            updateFavoriteCount();
        }
        
        function toggleFavorite(song) {
            if (!song || !song.id) return;
            const id = song.id;
            if (favorites[id]) {
                // 取消收藏
                delete favorites[id];
                const idx = favoriteOrder.indexOf(id);
                if (idx !== -1) favoriteOrder.splice(idx, 1);
            } else {
                // 添加收藏 - 存储完整信息
                favorites[id] = {
                    id: id,
                    title: song.title || '未知歌曲',
                    artist: song.artist || '未知歌手',
                    album: song.album || '',
                    artwork: song.artwork || DEFAULT_COVER,
                    favTime: Date.now()
                };
                if (!favoriteOrder.includes(id)) {
                    favoriteOrder.push(id);
                }
            }
            saveFavorites();
        
            // 重新渲染当前列表（更新心形图标）
            if (isFavoriteView) {
                // 如果在收藏视图，需要重建播放列表
                rebuildFavoritePlaylist();
            } else {
                renderPlaylist();
            }
        }
        
        function isFavorited(songId) {
            return !!favorites[songId];
        }
        
        function getHeartSVG(filled) {
            if (filled) {
                return `<svg class="w-4 h-4" fill="#E03A3A" stroke="#E03A3A" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"/></svg>`;
            } else {

        // ================== API 调用 ==================
        async function searchMusic(query, page) {
            const url =
                `http://search.kuwo.cn/r.s?client=kt&all=${encodeURIComponent(query)}&pn=${page-1}&rn=30&uid=2574109560&ver=kwplayer_ar_8.5.4.2&vipver=1&ft=music&cluster=0&strategy=2012&encoding=utf8&rformat=json&vermerge=1&mobi=1`;
            const response = await fetch(getProxyUrl(url));
            let text = await response.text();
            if (text.startsWith('callback(') || text.startsWith('jsonp(')) {
                text = text.substring(text.indexOf('(') + 1, text.lastIndexOf(')'));
            }
            let res;
            try { res = JSON.parse(text); } catch (e) { res = eval('(' + text + ')'); }
            const songs = res.abslist.map(_ => ({
                id: _.MUSICRID.replace("MUSIC_", ""),
                artwork: artworkShort2Long(_.web_albumpic_short),
                title: decodeHTML(_.NAME || ""),
                artist: decodeHTML(_.ARTIST || ""),
                album: decodeHTML(_.ALBUM || ""),
            }));
            return { isEnd: (+res.PN + 1) * +res.RN >= +res.TOTAL, data: songs };
        }
        
        async function fetchLyricsWithRetry(songId, retries = 2) {
            const url = `http://m.kuwo.cn/newh5/singles/songinfoandlrc?musicId=${songId}&httpStatus=1`;
            for (let attempt = 0; attempt <= retries; attempt++) {
                try {
                    const response = await fetch(getProxyUrl(url));
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const res = await response.json();
                    const rawList = res.data?.lrclist || [];
                    if (rawList.length === 0) {
                        if (attempt === retries) return [];
                        await new Promise(r => setTimeout(r, 300 * (attempt + 1)));
                        continue;
                    }
                    const parsed = rawList.map(line => {
                        let time = 0;
                        if (typeof line.time === 'string' && line.time.includes(':')) {
                            const parts = line.time.split(':');
                            if (parts.length === 2) time = parseInt(parts[0]) * 60 + parseFloat(parts[1]);
                        } else { time = parseFloat(line.time) || 0; }
                        return { time, text: decodeHTML(line.lineLyric || '') };
                    }).filter(item => item.text);
                    return parsed;
                } catch (e) {
                    if (attempt === retries) return [];
                    await new Promise(r => setTimeout(r, 300 * (attempt + 1)));
                }
            }
            return [];
        }
        
        async function fetchHighResArtwork(songId) {
            const url = `http://m.kuwo.cn/newh5/singles/songinfoandlrc?musicId=${songId}&httpStatus=1`;
            try {
                const response = await fetch(getProxyUrl(url));
                const res = await response.json();
                const originalUrl = res.data?.songinfo?.pic;
                if (originalUrl) {
                    const secureUrl = originalUrl.replace(/^http:/i, "https:");
                    if (secureUrl.includes("starheads/")) return secureUrl.replace(/starheads\/\d+/, "starheads/800");
                    if (secureUrl.includes("albumcover/")) return secureUrl.replace(/albumcover\/\d+/, "albumcover/800");
                    return secureUrl;
                }
                return null;
            } catch (e) { return null; }
        }

            if (idx < 0 || idx >= playlist.length) return;
        
            await ensureAudioContext();

            const song = playlist[currentIndex];

            // 如果是收藏视图，但歌曲不在 favorites 中，将其添加到 favorites（自动收藏）

                toggleFavorite(song);
            }
        
            renderPlaylist();
            playerTitle.innerText = song.title;
            playerArtist.innerText = song.artist;
        
            const QUALITY_MAP = { '128k': 'standard', '320k': 'exhigh', 'flac': 'lossless' };
            const apiLevel = QUALITY_MAP[qualitySelect.value] || 'standard';
            const playUrl =
                `https://music.nxinxz.com/kw.php?id=${encodeURIComponent(song.id)}&level=${apiLevel}&type=mp3`;
            audioPlayer.src = playUrl;
            audioPlayer.play().catch(err => console.log('播放需用户交互', err));
            updatePlayButtonState(true);
            isPlaying = true;
        
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artist,
                    album: song.album || '天扬音乐',
                    artwork: [{ src: song.artwork || DEFAULT_COVER, sizes: '96x96', type: 'image/png' }]
                });
                navigator.mediaSession.setActionHandler('play', () => { audioPlayer.play(); });
                navigator.mediaSession.setActionHandler('pause', () => { audioPlayer.pause(); });
                navigator.mediaSession.setActionHandler('previoustrack', () => {
                    if (playlist.length) {
                        const newIdx = currentIndex > 0 ? currentIndex - 1 : playlist.length - 1;
                        playSong(newIdx);
                    }
                });
                navigator.mediaSession.setActionHandler('nexttrack', () => {
                    if (playlist.length) {
                        const newIdx = currentIndex < playlist.length - 1 ? currentIndex + 1 : 0;
                        playSong(newIdx);
                    }
                });

        // ================== 进度与歌词更新 ==================
        function updateProgressAndLyrics() {
            if (!isPageVisible) {
                rafId = requestAnimationFrame(updateProgressAndLyrics);
                return;
            }
            if (!isDragging) {
                const cur = audioPlayer.currentTime || 0;
                const dur = audioPlayer.duration || 0;
                if (dur > 0) {
                    const pct = (cur / dur) * 100;
                    progressBar.style.width = pct + '%';
                    progressThumb.style.left = pct + '%';
                }
                currentTimeEl.innerText = formatTime(cur);
                durationTimeEl.innerText = formatTime(dur);
            }
            if (lyrics.length > 0 && !isDragging) {
                let activeIdx = -1;
                const cur = audioPlayer.currentTime || 0;
                for (let i = 0; i < lyrics.length; i++) {
                    if (cur >= lyrics[i].time) activeIdx = i;
                    else break;
                }
                if (activeIdx === -1 && lyrics.length > 0) activeIdx = 0;
                if (activeIdx !== lastActiveIdx && activeIdx !== -1) {
                    lastActiveIdx = activeIdx;
                    const line = lyrics[activeIdx];
                    miniLyricText.innerText = line.text ? `TYMUSIC ${line.text}` : "🎵 ...";
                    if (lyricsContainer) {
                        document.querySelectorAll('.lyric-line').forEach((el, idx) => {
                            if (idx === activeIdx) {
                                el.className =
                                    'lyric-line py-2 px-1.5 text-center text-sm md:text-base text-brand-300 font-extrabold transition-all duration-300 transform scale-105 drop-shadow-md';
                                const containerHeight = lyricsContainer.clientHeight;
                                const lineOffsetTop = el.offsetTop;
                                const lineHeight = el.clientHeight;
                                lyricsContainer.scrollTo({ top: lineOffsetTop - containerHeight / 2 + lineHeight / 2,
                                    behavior: 'smooth' });
                            } else {
                                el.className =
                                    'lyric-line py-1 px-1.5 text-center text-xs md:text-sm text-black/50 font-medium transition-all duration-200 cursor-pointer hover:text-black rounded';
                            }
                        });
                    }
                }
            }
            rafId = requestAnimationFrame(updateProgressAndLyrics);
        }
        
        function startProgressLoop() {

        // ================== 进度条拖拽 ==================
        function updateProgressUI(pct) {
            pct = Math.max(0, Math.min(100, pct));
            progressBar.style.width = pct + '%';
            progressThumb.style.left = pct + '%';
            if (audioPlayer.duration) {
                const sec = (pct / 100) * audioPlayer.duration;
                currentTimeEl.innerText = formatTime(sec);
            }
        }
        
        function setProgressFromEvent(clientX) {
            if (!audioPlayer.duration) return;
            const rect = progressContainer.getBoundingClientRect();
            let x = (clientX - rect.left) / rect.width;
            x = Math.max(0, Math.min(1, x));
            const pct = x * 100;
            updateProgressUI(pct);
            dragTargetPct = pct;
        }
        
        function finalizeSeek() {
            if (audioPlayer.duration) {
                const sec = (dragTargetPct / 100) * audioPlayer.duration;
                audioPlayer.currentTime = sec;
                currentTimeEl.innerText = formatTime(sec);
                progressBar.style.width = dragTargetPct + '%';
                progressThumb.style.left = dragTargetPct + '%';
            }
        }
        
        progressContainer.addEventListener('mousedown', (e) => {
            if (!audioPlayer.duration) return;
            isDragging = true;
            progressContainer.classList.add('dragging');
            setProgressFromEvent(e.clientX);
            e.preventDefault();
        });
        document.addEventListener('mousemove', (e) => {
            if (isDragging) setProgressFromEvent(e.clientX);
        });
        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                progressContainer.classList.remove('dragging');
                finalizeSeek();
            }
        });
        progressContainer.addEventListener('touchstart', (e) => {
            if (!audioPlayer.duration) return;
            isDragging = true;
            progressContainer.classList.add('dragging');
            const touch = e.touches[0];
            setProgressFromEvent(touch.clientX);
            e.preventDefault();
        }, { passive: false });
        document.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const touch = e.touches[0];
                setProgressFromEvent(touch.clientX);
                e.preventDefault();
            }
        }, { passive: false });
        document.addEventListener('touchend', () => {
            if (isDragging) {
                isDragging = false;
                progressContainer.classList.remove('dragging');
                finalizeSeek();
            }
        });
        progressContainer.addEventListener('click', (e) => {
            if (!isDragging) {
                setProgressFromEvent(e.clientX);
                finalizeSeek();
            }
        });
        
        // ================== 定位当前歌曲 ==================
        function locateCurrentSong() {
            if (currentIndex === -1 || !playlist.length) {
                miniLyricText.innerText = '⚠️ 没有正在播放的歌曲';
                setTimeout(() => {
                    miniLyricText.innerText = '🎵 天扬音乐，听我想听';
                }, 1500);
                return;
            }
            const rows = musicList.querySelectorAll('[data-index]');
            let targetRow = null;
            for (const row of rows) {
                if (parseInt(row.dataset.index, 10) === currentIndex) {
                    targetRow = row;
                    break;
                }
            }
            if (targetRow) {
                targetRow.scrollIntoView({ block: 'center', behavior: 'smooth' });
                targetRow.classList.add('locate-btn-highlight');
                setTimeout(() => {
                    targetRow.classList.remove('locate-btn-highlight');
                }, 1200);
            } else {
                miniLyricText.innerText = '⚠️ 当前歌曲不在本页或收藏列表中';
                setTimeout(() => {
                    miniLyricText.innerText = '🎵 天扬音乐，听我想听';
                }, 2000);
            }
        }
        
        locateBtn.addEventListener('click', locateCurrentSong);
        
        // ================== 事件绑定 ==================
        searchBtn.onclick = triggerSearch;
        searchInput.onkeypress = e => { if (e.key === 'Enter') triggerSearch(); };
        
        musicList.addEventListener('click', e => {
            const row = e.target.closest('[data-index]');
            if (row) {
                const idx = parseInt(row.dataset.index, 10);
                if (!isNaN(idx) && idx >= 0 && idx < playlist.length) {
                    playSong(idx);
                }
            }
        });
        
        prevPageBtn.onclick = async () => { if (currentPage > 1) { currentPage--;
                await loadSearchList(); } };
        nextPageBtn.onclick = async () => { currentPage++;
            await loadSearchList(); };
        
        playBtn.onclick = async () => {
            await ensureAudioContext();
            if (audioPlayer.src) {
                if (audioPlayer.paused) {
                    audioPlayer.play().catch(() => {});
                    updatePlayButtonState(true);
                } else {
                    audioPlayer.pause();
                    updatePlayButtonState(false);
                }
            }
        };
        
        prevBtn.onclick = () => {
            if (playlist.length) {
                const newIdx = currentIndex > 0 ? currentIndex - 1 : playlist.length - 1;
                playSong(newIdx);
            }
        };
        nextBtn.onclick = () => {
            if (playlist.length) {
                const newIdx = currentIndex < playlist.length - 1 ? currentIndex + 1 : 0;
                playSong(newIdx);
            }
        };
        
        lyricsContainer.onclick = e => {
            const line = e.target.closest('.lyric-line');
            if (line) { const t = parseFloat(line.dataset.time); if (!isNaN(t)) audioPlayer.currentTime = t; }
        };
        
        qualitySelect.onchange = () => {
            if (currentIndex !== -1 && playlist[currentIndex]) {
                const t = audioPlayer.currentTime;
                const idx = currentIndex;
                playSong(idx).then(() => { audioPlayer.currentTime = t; });
            }
        };
        
        document.addEventListener('visibilitychange', () => {
            isPageVisible = !document.hidden;
            if (isPageVisible) {
                if (rafId) cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(updateProgressAndLyrics);
            }
        });
        
        audioPlayer.onplay = () => { updatePlayButtonState(true);
            isPlaying = true; };
        audioPlayer.onpause = () => { updatePlayButtonState(false);
            isPlaying = false; };
        
        audioPlayer.onended = () => {
            if (currentIndex < playlist.length - 1) {
                playSong(currentIndex + 1);
            } else {
                // 如果是收藏视图，从头播放
                if (isFavoriteView) {
                    if (playlist.length > 0) playSong(0);
                    return;
                }
                // 普通视图：尝试加载下一页
                if (!isEnd) {
                    currentPage++;
                    loadSearchList().then(() => {
                        if (playlist.length > 0) {
                            playSong(0);
                        }
                    }).catch(err => {
                        console.warn('自动加载下一页失败', err);
                        if (playlist.length > 0) playSong(0);
                    });
                } else {
                    if (playlist.length > 0) playSong(0);
                }
            }
        };
        
        audioPlayer.onerror = (e) => {
            console.warn('播放错误，尝试重试', e);
            if (audioPlayer.src) {
                setTimeout(() => {
                    audioPlayer.play().catch(() => {});
                }, 1000);
            }
        };
        
        // ================== 初始化 ==================
        window.addEventListener('DOMContentLoaded', () => {
            loadFavorites();
            updateFavoriteCount();
            searchInput.value = '抖音热歌';
            triggerSearch();
            startProgressLoop();
        });
        
        console.log('🎵 天扬音乐网 (修复版：收藏数据持久化) 已加载');
    </script>
</body>

</html>
